name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:                       # runs on every PR and every merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  deploy-test:                         # only after a merge to main
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment: test
    concurrency: deploy-test           # never two deploys at once
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t test
      - run: databricks bundle deploy -t test
      - run: databricks bundle run -t test loans_pipeline    # integration test on masked data

  deploy-prod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod                  # pauses here until the approver clicks Approve
    concurrency: deploy-prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
      - run: databricks bundle run -t prod loans_pipeline    # at work, the schedule runs it instead