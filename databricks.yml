bundle:
  name: loans_platform

include:
  - resources/*.yml

workspace:
  host: https://dbc-faf5bf41-0e82.cloud.databricks.com

variables:
  catalog:
    description: Catalog this environment writes to
  source_catalog:
    description: Catalog this environment reads source data from

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev
      source_catalog: corebank_masked

  test:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/test
    variables:
      catalog: test
      source_catalog: corebank_masked

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      catalog: prod
      source_catalog: corebank_replica    # only prod reads real data