resources:
  jobs:
    loans_pipeline:
      name: loans_pipeline_${bundle.target}
      max_concurrent_runs: 1          # never two runs writing at once
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_catalog
          default: ${var.source_catalog}
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/nb_setup.py
        - task_key: bronze
          depends_on: [{task_key: setup}]
          notebook_task:
            notebook_path: ../src/nb_bronze.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../src/nb_silver.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../src/nb_gold.py
        - task_key: quality
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../src/nb_quality.py
        - task_key: gold
          depends_on: [{task_key: quality}]     # was: silver
          notebook_task:
            notebook_path: ../src/nb_gold.py